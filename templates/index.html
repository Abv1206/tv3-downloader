<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>3Cat | Descàrregues</title>
    <!-- Importamos la fuente corporativa geométrica -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0d14;
            --bg-surface: #141824;
            --bg-elevated: #1e2436;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --sx3-cyan: #00f0ff;
            --sx3-pink: #ff1461;
            --sx3-yellow: #ffdb00;
            --success: #10b981;
            --danger: #ef4444;
            --border-subtle: #2e364f;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 20px; 
        }

        /* Cabecera y Logotipo */
        .header-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-subtle);
        }

        .logo-svg { width: 48px; height: 48px; }
        h2 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .text-gradient {
            background: linear-gradient(90deg, var(--sx3-cyan), var(--sx3-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Formularios */
        .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .form-group { flex: 1; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
        
        input[type="text"], select { 
            width: 100%; padding: 14px; box-sizing: border-box; 
            background-color: var(--bg-surface); color: var(--text-main);
            border: 2px solid var(--border-subtle); border-radius: 8px; 
            font-family: inherit; font-size: 15px; transition: all 0.3s ease;
        }
        
        input[type="text"]:focus, select:focus { 
            border-color: var(--sx3-cyan); outline: none; 
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2); 
        }

        /* Botones */
        .btn-primary { 
            padding: 14px 28px; background: linear-gradient(135deg, var(--sx3-pink), #cc0044); 
            color: white; border: none; border-radius: 8px; cursor: pointer; 
            font-weight: 800; font-size: 16px; font-family: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(255, 20, 97, 0.4); 
        }

        .controls { margin-top: 25px; display: none; gap: 12px; }
        .controls button { 
            padding: 12px 20px; border: none; cursor: pointer; color: white; 
            border-radius: 8px; font-weight: 800; font-family: inherit; text-transform: uppercase; 
            font-size: 14px; letter-spacing: 0.5px; transition: opacity 0.2s;
        }
        .controls button:hover { opacity: 0.9; }
        .btn-pause { background-color: var(--sx3-yellow); color: #000 !important; }
        .btn-resume { background-color: var(--sx3-cyan); color: #000 !important; }
        .btn-stop { background-color: var(--border-subtle); color: white; }

        /* Cuadrícula de columnas */
        .board { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 40px; }
        .column { background: var(--bg-surface); border-radius: 12px; padding: 15px; min-height: 300px; border: 1px solid var(--border-subtle); }
        .column-header { font-weight: 800; text-align: center; margin-bottom: 20px; padding-bottom: 12px; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid; }
        
        .header-grey { border-color: var(--sx3-cyan); color: var(--text-main); }
        .header-green { border-color: var(--success); color: var(--success); }
        .header-red { border-color: var(--danger); color: var(--danger); }

        /* Tarjetas de descargas */
        .task-card { 
            background: var(--bg-elevated); border-radius: 8px; padding: 14px; margin-bottom: 12px; 
            border-left: 4px solid var(--border-subtle); position: relative; overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .task-card.downloading { border-left-color: var(--sx3-cyan); }
        .task-card.finished { border-left-color: var(--success); }
        .task-card.failed { border-left-color: var(--danger); }
        
        .task-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; line-height: 1.4; word-break: break-all; }
        .task-meta { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; font-weight: 600;}
        
        .progress-bar-bg { background-color: rgba(255,255,255,0.1); width: 100%; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 10px; margin-bottom: 8px; }
        .progress-bar { background: linear-gradient(90deg, var(--sx3-cyan), #00b3ff); width: 0%; height: 100%; transition: width 0.3s ease; }

        /* Tarjeta de estado Loading */
        #loading-card { border-left-color: var(--sx3-yellow); background-color: rgba(255, 219, 0, 0.05); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@formkit/auto-animate@1/index.min.js"></script>
</head>
<body>

    <div class="header-container">
        <!-- Logotipo vectorial personalizado basado en colores SX3 -->
        <svg class="logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="64" height="64" rx="16" fill="#141824"/>
            <path d="M32 44L18 28H26V16H38V28H46L32 44Z" fill="#00f0ff"/>
            <path d="M18 48H46V52H18V48Z" fill="#ff1461"/>
        </svg>
        <h2><span class="text-gradient">3Cat</span> / Downloader</h2>
    </div>

    <form id="downloadForm">
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="url">Enllaç de la Temporada o Capítol</label>
            <input type="text" id="url" name="url" required placeholder="https://www.3cat.cat/tv3/sx3/...">
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="quality">Qualitat de descàrrega</label>
                <select id="quality" name="quality">
                    <option value="media" selected>Mitjana (Estàndard 540p)</option>
                    <option value="alta">Alta (Màxima disponible)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="concurrent">Fitxers simultanis</label>
                <select id="concurrent" name="concurrent">
                    <option value="1">1 fitxer (Mode segur)</option>
                    <option value="2">2 fitxers</option>
                    <option value="3">3 fitxers</option>
                    <option value="5">5 fitxers (Alt rendiment)</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn-primary">Iniciar Descàrrega</button>
    </form>

    <div class="controls" id="controls">
        <button id="btn-pause" class="btn-pause" onclick="sendAction('pause')">Pausar</button>
        <button id="btn-stop" class="btn-stop" onclick="sendAction('stop')">Cancel·lar tot</button>
    </div>

    <div class="board" id="board" style="display: none;">
        <div class="column">
            <div class="column-header header-grey">En curs / A la cua</div>
            <div id="col-pending"></div>
        </div>
        <div class="column">
            <div class="column-header header-green">Completats</div>
            <div id="col-finished"></div>
        </div>
        <div class="column">
            <div class="column-header header-red">Errors / Cancel·lats</div>
            <div id="col-failed"></div>
        </div>
    </div>

    <script>
        let pollInterval;
        let isPolling = false;
        let wasExtracting = false;

        window.addEventListener('DOMContentLoaded', () => {
            if (window.autoAnimate) {
                window.autoAnimate(document.getElementById('col-pending'));
                window.autoAnimate(document.getElementById('col-finished'));
                window.autoAnimate(document.getElementById('col-failed'));
            }
            checkStatusOnLoad();
        });

        async function checkStatusOnLoad() {
            const res = await fetch('/status');
            const data = await res.json();
            if ((data.tasks && data.tasks.length > 0) || data.is_extracting) {
                showBoard();
                if (!isPolling) startPolling();
            }
        }

        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const response = await fetch('/download', { method: 'POST', body: formData });
            const result = await response.json();
            
            if(result.status === 'success') {
                e.target.reset(); 
                showBoard();
                if (!isPolling) startPolling();
            }
        });

        document.getElementById('concurrent').addEventListener('change', async (e) => {
            const newValue = e.target.value;
            await fetch('/set_concurrent', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ concurrent: newValue })
            });
        });

        function showBoard() {
            document.getElementById('board').style.display = 'grid';
            document.getElementById('controls').style.display = 'flex';
        }

        function startPolling() {
            isPolling = true;
            pollInterval = setInterval(async () => {
                const res = await fetch('/status');
                const data = await res.json();
                updateDOM(data);
            }, 1000);
        }

        function updateDOM(data) {
            if (data.max_concurrent) {
                document.getElementById('concurrent').value = data.max_concurrent;
            }

            const colPending = document.getElementById('col-pending');
            const colFinished = document.getElementById('col-finished');
            const colFailed = document.getElementById('col-failed');
            const submitBtn = document.querySelector('#downloadForm button');
            const controls = document.getElementById('controls');

            if (data.is_extracting) {
                wasExtracting = true;
            } else if (wasExtracting && data.tasks.length === 0) {
                wasExtracting = false;
                alert("No s'han trobat vídeos a la URL proporcionada o el temps d'espera ha finalitzat.");
            }

            if (data.tasks.length === 0 && !data.is_extracting) {
                document.getElementById('board').style.display = 'none';
                controls.style.display = 'none';
                submitBtn.textContent = 'Iniciar Descàrrega';
                colPending.innerHTML = '';
                colFinished.innerHTML = '';
                colFailed.innerHTML = '';
                wasExtracting = false;
                return;
            } else {
                document.getElementById('board').style.display = 'grid';
                controls.style.display = 'flex';
            }

            const activeTasks = data.tasks.filter(t => t.status === 'pending' || t.status === 'downloading');
            
            if (activeTasks.length > 0 || data.is_extracting) {
                submitBtn.textContent = 'Afegir a la cua';
            } else {
                submitBtn.textContent = 'Iniciar Descàrrega';
            }

            const btnPause = document.getElementById('btn-pause');
            const btnStop = document.getElementById('btn-stop');
            
            if (activeTasks.length === 0 && !data.is_extracting) {
                btnPause.style.display = 'none';
                btnStop.textContent = 'Netejar historial';
                btnStop.className = 'btn-stop';
                btnStop.onclick = () => window.sendAction('clear');
            } else {
                btnPause.style.display = 'block';
                btnStop.textContent = 'Cancel·lar tot';
                btnStop.className = 'btn-stop';
                btnStop.onclick = () => window.sendAction('stop');
                
                if (data.is_paused) {
                    btnPause.textContent = 'Reprendre';
                    btnPause.className = 'btn-resume';
                    btnPause.onclick = () => window.sendAction('resume');
                } else {
                    btnPause.textContent = 'Pausar';
                    btnPause.className = 'btn-pause';
                    btnPause.onclick = () => window.sendAction('pause');
                }
            }

            if (data.is_extracting) {
                let loadingEl = document.getElementById('loading-card');
                if (!loadingEl) {
                    loadingEl = document.createElement('div');
                    loadingEl.id = 'loading-card';
                    loadingEl.className = 'task-card';
                    loadingEl.innerHTML = `
                        <div class="task-title" style="color: var(--sx3-yellow);">Obtenint vídeos...</div>
                        <div class="task-meta">Explorant la web internament. Això pot trigar uns segons.</div>
                    `;
                    colPending.prepend(loadingEl);
                }
            } else {
                let loadingEl = document.getElementById('loading-card');
                if (loadingEl) loadingEl.remove();
            }

            data.tasks.forEach(task => {
                let el = document.getElementById(task.id);
                
                if (!el) {
                    el = document.createElement('div');
                    el.id = task.id;
                    el.className = 'task-card';
                    el.dataset.status = ''; 
                    el.innerHTML = `
                        <div class="task-title" id="title-${task.id}">${task.title}</div>
                        <div class="card-body"></div>
                    `;
                    colPending.appendChild(el);
                }

                document.getElementById(`title-${task.id}`).textContent = task.title;
                const bodyEl = el.querySelector('.card-body');

                if (task.status === 'downloading') {
                    if (el.dataset.status !== 'downloading') {
                        el.className = 'task-card downloading';
                        el.dataset.status = 'downloading';
                        bodyEl.innerHTML = `
                            <div class="progress-bar-bg"><div class="progress-bar" id="bar-${task.id}" style="width: 0%"></div></div>
                            <div class="task-meta"><span id="pct-${task.id}">0%</span><span id="spd-${task.id}" style="color: var(--sx3-cyan);">0 B/s</span></div>
                        `;
                    }
                    
                    document.getElementById(`bar-${task.id}`).style.width = task.percent + '%';
                    document.getElementById(`pct-${task.id}`).textContent = task.percent + '%';
                    document.getElementById(`spd-${task.id}`).textContent = task.speed;
                    
                    if (el.parentElement !== colPending) colPending.appendChild(el);
                } 
                else if (task.status === 'pending') {
                    if (el.dataset.status !== 'pending') {
                        el.className = 'task-card';
                        el.dataset.status = 'pending';
                        bodyEl.innerHTML = `<div class="task-meta">A la cua...</div>`;
                    }
                    if (el.parentElement !== colPending) colPending.appendChild(el);
                } 
                else if (task.status === 'finished') {
                    if (el.dataset.status !== 'finished') {
                        el.className = 'task-card finished';
                        el.dataset.status = 'finished';
                        bodyEl.innerHTML = `<div class="task-meta" style="color: var(--success);">Completat</div>`;
                        if (el.parentElement !== colFinished) colFinished.insertBefore(el, colFinished.firstChild);
                    }
                } 
                else if (task.status === 'failed') {
                    if (el.dataset.status !== 'failed') {
                        el.className = 'task-card failed';
                        el.dataset.status = 'failed';
                        bodyEl.innerHTML = `<div class="task-meta" style="color: var(--danger);">Cancel·lat / Error</div>`;
                        if (el.parentElement !== colFailed) colFailed.insertBefore(el, colFailed.firstChild);
                    }
                }
            });
        }

        window.sendAction = async function(action) {
            wasExtracting = false;
            await fetch('/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action })
            });
        };
    </script>
</body>
</html>
